<!DOCTYPE html>
<html lang="vi" data-theme="cyan" data-appearance="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NeonPlay - YouTube playlist manager with search, favorites, and auto-play queue">
  <meta name="theme-color" content="#0a0e17">
  <title>NeonPlay | YouTube Playlist Manager</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="ambientBg" class="ambient-bg" aria-hidden="true"></div>
  <canvas id="particles" class="particles" aria-hidden="true"></canvas>
  <div class="aurora aurora--1" aria-hidden="true"></div>
  <div class="aurora aurora--2" aria-hidden="true"></div>
  <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>

  <div id="overlay" class="overlay" aria-hidden="true"></div>

  <aside id="sidebar" class="sidebar reveal-on-scroll" aria-label="Danh sách yêu thích">
    <div class="sidebar__header">
      <h2 class="sidebar__title">
        <span class="sidebar__icon heartbeat" aria-hidden="true">♥</span>
        Yêu thích
        <span id="favCount" class="badge">0</span>
      </h2>
    </div>

    <div class="sidebar__add">
      <label for="linkInput" class="sr-only">Thêm link YouTube</label>
      <textarea
        id="linkInput"
        class="input input--textarea"
        placeholder="Dán link YouTube (nhiều link cách nhau bằng dấu phẩy)"
        rows="2"
      ></textarea>
      <div class="sidebar__add-actions">
        <button id="pasteLinkBtn" class="btn btn--secondary btn--sm ripple-host" type="button">📋 Dán link</button>
        <button id="addFavoriteBtn" class="btn btn--primary btn--sm ripple-host" type="button">+ Thêm</button>
      </div>
    </div>

    <div id="favoriteList" class="sidebar__list"></div>
  </aside>

  <div class="layout" id="layout">
    <header class="header">
      <button id="sidebarToggle" class="btn btn--icon header__menu ripple-host" type="button" aria-label="Mở danh sách yêu thích">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>

      <div class="header__brand">
        <span class="header__logo pulse-glow float-icon" aria-hidden="true">▶</span>
        <h1 class="header__title gradient-text">NeonPlay</h1>
        <span class="header__tag">Playlist Manager</span>
      </div>

      <div class="theme-picker" role="group" aria-label="Chọn theme màu">
        <button class="theme-btn theme-btn--cyan is-active ripple-host" data-theme="cyan" type="button" title="Cyan Neon"></button>
        <button class="theme-btn theme-btn--purple ripple-host" data-theme="purple" type="button" title="Purple Dream"></button>
        <button class="theme-btn theme-btn--emerald ripple-host" data-theme="emerald" type="button" title="Emerald Wave"></button>
      </div>

      <button id="appearanceBtn" class="btn btn--icon ripple-host" type="button" title="Dark / Light mode" aria-label="Đổi giao diện sáng tối">🌙</button>
      <button id="helpBtn" class="btn btn--icon ripple-host" type="button" title="Phím tắt (?)" aria-label="Xem phím tắt">?</button>

      <div class="header__shortcuts" aria-label="Phím tắt">
        <kbd>?</kbd> trợ giúp · <kbd>/</kbd> tìm · <kbd>N</kbd> tiếp
      </div>
    </header>

    <section class="search-section reveal-on-scroll" aria-label="Tìm kiếm video">
      <div class="search-bar">
        <label for="searchInput" class="sr-only">Tìm kiếm video YouTube</label>
        <input
          type="search"
          id="searchInput"
          class="input input--search glow-input"
          placeholder="Tìm kiếm video trên YouTube..."
          autocomplete="off"
        >
        <button id="searchBtn" class="btn btn--primary btn--shimmer ripple-host" type="button">
          <span id="searchBtnText">Tìm kiếm</span>
        </button>
      </div>

      <div id="searchHistory" class="search-history" hidden></div>

      <div class="controls">
        <button id="playSearchBtn" class="btn btn--secondary ripple-host" type="button">Phát tìm kiếm</button>
        <button id="playFavoriteBtn" class="btn btn--secondary ripple-host" type="button">Phát yêu thích</button>
        <button id="clearQueueBtn" class="btn btn--ghost ripple-host" type="button">Xóa queue</button>
        <span class="controls__count">
          Queue: <strong id="queueCount">0</strong> video
        </span>
      </div>
    </section>

    <section class="player-section reveal-on-scroll" aria-label="Trình phát video">
      <div id="playerWrap" class="player-wrap">
        <div class="player-wrap__shine" aria-hidden="true"></div>
        <iframe
          id="player"
          title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
        ></iframe>
        <div id="equalizer" class="equalizer" hidden aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <canvas id="visualizer" class="visualizer" aria-hidden="true"></canvas>

      <div class="player-meta">
        <p id="nowPlaying" class="now-playing">Chưa chọn video</p>
        <span id="queueProgress" class="queue-progress">0 / 0</span>
      </div>

      <div class="queue-bar" aria-hidden="true">
        <div id="queueBarFill" class="queue-bar__fill" style="width: 0%"></div>
      </div>

      <div class="player-controls glass-panel" role="toolbar" aria-label="Điều khiển phát">
        <button id="prevBtn" class="ctrl-btn ripple-host" type="button" title="Video trước (P)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button id="nextBtn" class="ctrl-btn ctrl-btn--main ripple-host" type="button" title="Video tiếp (N)">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button id="shuffleBtn" class="ctrl-btn ripple-host" type="button" title="Phát ngẫu nhiên">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        </button>
        <button id="repeatBtn" class="ctrl-btn ripple-host" type="button" title="Lặp lại: Tắt">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 014-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 01-4 4H3"/></svg>
          <span id="repeatBadge" class="ctrl-badge" hidden>1</span>
        </button>
        <div class="player-controls__divider"></div>
        <button id="addFavBtn" class="ctrl-btn ripple-host" type="button" title="Thêm vào yêu thích">♥</button>
        <button id="copyLinkBtn" class="ctrl-btn ripple-host" type="button" title="Sao chép link">🔗</button>
        <button id="theaterBtn" class="ctrl-btn ripple-host" type="button" title="Chế độ rạp chiếu (T)">⛶</button>
      </div>
    </section>

    <section class="queue-section reveal-on-scroll" aria-label="Danh sách video">
      <h2 class="section-title gradient-text-sub">Danh sách phát</h2>
      <div id="videoList" class="video-grid"></div>
    </section>

    <footer class="footer reveal-on-scroll">
      <p>NeonPlay · Vite + TypeScript · YouTube Data API v3</p>
    </footer>
  </div>

  <div id="shortcutsModal" class="modal" hidden role="dialog" aria-labelledby="shortcutsTitle" aria-modal="true">
    <div class="modal__backdrop"></div>
    <div class="modal__panel glass-panel">
      <div class="modal__header">
        <h2 id="shortcutsTitle" class="gradient-text">Phím tắt</h2>
        <button id="closeModalBtn" class="btn btn--icon ripple-host" type="button" aria-label="Đóng">×</button>
      </div>
      <div class="modal__grid">
        <div class="shortcut-row"><kbd>/</kbd><span>Focus tìm kiếm</span></div>
        <div class="shortcut-row"><kbd>N</kbd><span>Video tiếp theo</span></div>
        <div class="shortcut-row"><kbd>P</kbd><span>Video trước</span></div>
        <div class="shortcut-row"><kbd>F</kbd><span>Mở yêu thích</span></div>
        <div class="shortcut-row"><kbd>T</kbd><span>Chế độ rạp chiếu</span></div>
        <div class="shortcut-row"><kbd>?</kbd><span>Hiện phím tắt</span></div>
        <div class="shortcut-row"><kbd>Esc</kbd><span>Đóng / thoát</span></div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
